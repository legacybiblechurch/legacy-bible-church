<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worship Control — LBC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    @font-face {
      font-family: 'Priestacy';
      src: url('fonts/Priestacy.woff') format('woff'), url('fonts/Priestacy.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg:        #0d0d0f;
      --panel:     #141416;
      --panel-2:   #1b1b1e;
      --panel-3:   #232327;
      --line:      #2a2a2e;
      --line-soft: #202024;
      --ink:       #ececed;
      --ink-dim:   #9a9a9e;
      --ink-faint: #62626a;
      --gold:      #c9a84c;
      --live:      #d9534f;
      --warn:      #d8a657;
      --header-h:  52px;
      --footer-h:  62px;
      --sidebar-w: 250px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── header ─────────────────────────────── */
    #header {
      position: fixed; inset: 0 0 auto 0;
      height: var(--header-h);
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px;
      z-index: 100;
    }
    .wordmark { font-family: 'Priestacy', var(--font); font-size: 22px; color: var(--ink); }
    .header-spacer { flex: 1; }
    .kbd-hint { font-size: 12px; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; }
    .kbd {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--ink-dim);
    }
    .display-link {
      font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
      color: var(--ink); text-decoration: none;
      border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 12px;
    }
    .display-link:hover { border-color: var(--ink-faint); background: var(--panel-2); }
    .disp-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-dim); margin-right: 6px; }
    .disp-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
    .disp-pill.on .dot { background: #7bb37e; }
    .disp-pill.on { color: var(--ink-dim); }
    .disp-pill.off #disp-pill-text { color: var(--warn); }
    .empty-service { padding: 60px 24px; text-align: center; color: var(--ink-dim); font-size: 15px; line-height: 1.7; }
    .empty-service a { color: var(--ink); }

    /* ── layout ─────────────────────────────── */
    #layout {
      position: fixed; inset: var(--header-h) 0 var(--footer-h) 0;
      display: flex;
    }

    #sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-head {
      padding: 14px 16px 9px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    #song-list { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
    .song-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px 10px 16px; cursor: pointer;
      border-left: 2px solid transparent;
    }
    .song-item:hover { background: var(--panel-2); }
    .song-item.active { border-left-color: var(--gold); background: var(--panel-2); }
    .song-num { font-size: 11px; color: var(--ink-faint); flex-shrink: 0; font-variant-numeric: tabular-nums; padding-top: 1px; min-width: 12px; }
    .song-name {
      flex: 1; min-width: 0;
      font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--ink-dim);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .song-item.active .song-name { color: var(--ink); }
    .song-item.pending .song-name { color: var(--ink-faint); }
    .pend-tag {
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--warn); border: 1px solid rgba(216,166,87,0.35); border-radius: 3px;
      padding: 0 4px; margin-left: 4px; white-space: nowrap;
    }
    .song-count { font-size: 11px; color: var(--ink-faint); flex-shrink: 0; font-variant-numeric: tabular-nums; padding-top: 1px; }

    /* ── main / slide grid ──────────────────── */
    #main { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
    .song-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .main-song-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    /* the congregation sings to the YouTube audio, so the video has to be one
       click away from the slides - never a hunt in another tab mid-service */
    .yt-link {
      font-size: 12px; font-weight: 500; text-decoration: none;
      color: var(--ink-dim); background: var(--panel); border: 1px solid var(--line);
      padding: 4px 10px; border-radius: 5px; white-space: nowrap;
    }
    .yt-link:hover { color: var(--ink); border-color: var(--ink-faint); }
    .yt-link.missing { display: none; }
    #slide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px; }

    .slide-thumb {
      background: var(--panel); border: 1px solid var(--line-soft);
      border-radius: 6px; padding: 13px 14px; cursor: pointer;
      position: relative; min-height: 116px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .slide-thumb:hover { border-color: var(--ink-faint); background: var(--panel-2); }
    .slide-thumb.active { border-color: var(--gold); }
    .thumb-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--gold);
    }
    .thumb-lines { font-size: 12px; line-height: 1.5; color: var(--ink-dim); }
    .thumb-lines .tl { display: block; }
    .live-badge {
      position: absolute; top: 10px; right: 10px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--live);
    }
    .live-badge::before { content: '● '; }

    /* ── footer ─────────────────────────────── */
    #footer {
      position: fixed; inset: auto 0 0 0;
      height: var(--footer-h);
      background: var(--bg);
      border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
      padding: 0 18px;
      z-index: 100;
    }
    .nav-btn {
      background: var(--panel-2); border: 1px solid var(--line);
      color: var(--ink); font: inherit; font-size: 13px; font-weight: 600;
      padding: 9px 18px; border-radius: 6px; cursor: pointer; white-space: nowrap;
    }
    .nav-btn:hover { border-color: var(--ink-faint); background: var(--panel-3); }
    .nav-btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .nav-btn.primary:hover { background: #fff; }
    #position-info { flex: 1; text-align: center; font-size: 13px; color: var(--ink-faint); pointer-events: none; }
    #position-song { font-weight: 600; color: var(--ink-dim); }
    .blank-btn {
      background: transparent; border: 1px solid var(--line);
      color: var(--ink-faint); font: inherit; font-size: 12px; font-weight: 600;
      padding: 9px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap;
    }
    .blank-btn:hover { border-color: var(--ink-faint); color: var(--ink-dim); }
    .blank-btn.blanked { border-color: var(--live); color: var(--live); }

    ::-webkit-scrollbar { width: 7px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    /* ── mobile ─────────────────────────────── */
    @media (max-width: 760px) {
      :root { --header-h: 48px; --footer-h: 68px; }
      .kbd-hint { display: none; }
      #header { padding: 0 14px; gap: 10px; }
      .wordmark { font-size: 19px; }
      .display-link { padding: 7px 11px; }

      #layout { flex-direction: column; }
      #sidebar {
        width: auto; height: auto; flex-shrink: 0;
        border-right: 0; border-bottom: 1px solid var(--line);
        flex-direction: row; overflow: hidden;
      }
      .sidebar-head { display: none; }
      #song-list {
        display: flex; flex-direction: row; padding: 8px 10px; gap: 8px;
        overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      #song-list::-webkit-scrollbar { display: none; }
      .song-item {
        flex-direction: column; align-items: flex-start; gap: 2px;
        border: 1px solid var(--line); border-left: 1px solid var(--line);
        border-radius: 7px; padding: 8px 12px; white-space: nowrap;
      }
      .song-item.active { border-color: var(--gold); }
      .song-name { -webkit-line-clamp: 1; font-size: 13px; }
      .song-count::before { content: '· '; }

      #main { padding: 14px 14px 18px; }
      #slide-grid { grid-template-columns: 1fr; gap: 8px; }
      .slide-thumb { min-height: 0; padding: 12px 14px; }
      .thumb-lines { font-size: 13px; }

      #footer { padding: 0 10px; gap: 6px; }
      .nav-btn { flex: 1 1 0; min-width: 0; padding: 14px 6px; font-size: 14px; text-align: center; justify-content: center; }
      #position-info { display: none; }
      .blank-btn { flex: 0 0 62px; min-width: 0; padding: 14px 4px; font-size: 11px; margin: 0; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="header">
    <a href="worship.html" class="display-link" style="font-weight:500;color:var(--ink-dim)">&larr; Home</a>
    <span class="wordmark">Worship Control</span>
    <span class="header-spacer"></span>
    <span class="disp-pill off" id="disp-pill" title="Is the congregation screen open?"><span class="dot"></span><span id="disp-pill-text">Display not open</span></span>
    <span class="kbd-hint"><span class="kbd">&larr;</span><span class="kbd">&rarr;</span> move &nbsp;<span class="kbd">B</span> blank</span>
    <a href="worship-display.html" target="_blank" class="display-link">Open display &nearr;</a>
  </div>

  <div id="layout">
    <aside id="sidebar">
      <div class="sidebar-head">Today's songs</div>
      <div id="song-list"></div>
    </aside>
    <main id="main">
      <div class="song-bar">
        <div class="main-song-title" id="main-song-title"></div>
        <a class="yt-link missing" id="yt-link" target="_blank" rel="noopener">&#9654;&nbsp; Play on YouTube</a>
      </div>
      <div id="slide-grid"></div>
    </main>
  </div>

  <div id="footer">
    <button class="nav-btn" id="btn-prev">&larr; Prev</button>
    <div id="position-info"><span id="position-song"></span><span id="position-slide"></span></div>
    <button class="nav-btn primary" id="btn-next">Next &rarr;</button>
    <button class="blank-btn" id="btn-blank">Blank</button>
  </div>

  <script src="js/songs-data.js"></script>
  <script src="js/worship-songs.js"></script>
  <script src="js/sheet.js?v=12"></script>
  <script>

    var songs = [], songIdx = 0, slideIdx = 0, isBlank = false;
    var channel = new BroadcastChannel('lbc-worship');

    function buildSongs(items) {
      return items.map(function (it) {
        if (!it.lyrics || !it.lyrics.length) {
          return { title: it.title, ready: false, youtube: it.youtube || '',
                   slides: [{ label: '', lines: ['No words yet — open Studio to fix this song'] }] };
        }
        return { title: it.title, ready: true, youtube: it.youtube || '',
                 slides: LBCSheet.buildSlides(it.lyrics) };
      });
    }

    function broadcast() {
      var state = { songIndex: songIdx, slideIndex: slideIdx, blank: isBlank };
      localStorage.setItem('lbc-worship-state', JSON.stringify(state));
      channel.postMessage(state);
    }

    var displaySeen = 0;
    channel.onmessage = function (e) {
      if (e.data && e.data.type === 'ping' && e.data.from === 'display') displaySeen = Date.now();
    };
    setInterval(function () {
      var on = Date.now() - displaySeen < 4000;
      document.getElementById('disp-pill').className = 'disp-pill ' + (on ? 'on' : 'off');
      document.getElementById('disp-pill-text').textContent = on ? 'Display connected' : 'Display not open';
    }, 1000);

    function goTo(si, li) {
      if (!songs.length) return;
      if (si < 0 || si >= songs.length) return;
      if (li < 0 || li >= songs[si].slides.length) return;
      songIdx = si; slideIdx = li; render(); broadcast();
    }
    function next() {
      if (!songs.length) return;
      var s = songs[songIdx];
      if (slideIdx < s.slides.length - 1) goTo(songIdx, slideIdx + 1);
      else if (songIdx < songs.length - 1) goTo(songIdx + 1, 0);
    }
    function prev() {
      if (!songs.length) return;
      if (slideIdx > 0) goTo(songIdx, slideIdx - 1);
      else if (songIdx > 0) goTo(songIdx - 1, songs[songIdx - 1].slides.length - 1);
    }
    function toggleBlank() {
      isBlank = !isBlank;
      var b = document.getElementById('btn-blank');
      b.classList.toggle('blanked', isBlank);
      b.textContent = isBlank ? 'Show' : 'Blank';
      broadcast();
    }

    function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function render() {
      if (!songs.length) {
        document.getElementById('song-list').innerHTML = '';
        document.getElementById('main-song-title').textContent = '';
        document.getElementById('yt-link').className = 'yt-link missing';
        document.getElementById('slide-grid').innerHTML =
          '<div class="empty-service">Nothing is ready for Sunday yet.<br>' +
          '<a href="worship-studio.html" target="_blank" rel="noopener">Open Worship Studio</a> to add the songs, then come back here.</div>';
        document.getElementById('position-song').textContent = '';
        document.getElementById('position-slide').textContent = '';
        return;
      }
      var song = songs[songIdx];
      document.getElementById('song-list').innerHTML = songs.map(function (s, i) {
        return '<div class="song-item' + (i === songIdx ? ' active' : '') + (s.ready ? '' : ' pending') + '" onclick="goTo(' + i + ',0)">' +
          '<span class="song-num">' + (i + 1) + '</span>' +
          '<span class="song-name">' + esc(s.title) + (s.ready ? '' : ' <span class="pend-tag">no words</span>') + '</span>' +
          '<span class="song-count">' + s.slides.length + '</span></div>';
      }).join('');

      document.getElementById('main-song-title').textContent = song.title;

      var yt = document.getElementById('yt-link');
      yt.href = song.youtube || '#';
      yt.className = 'yt-link' + (song.youtube ? '' : ' missing');

      var grid = document.getElementById('slide-grid');
      grid.innerHTML = song.slides.map(function (slide, i) {
        var isActive = i === slideIdx;
        var preview = slide.lines.slice(0, 3).map(function (l) { return '<span class="tl">' + esc(l) + '</span>'; }).join('');
        return '<div class="slide-thumb' + (isActive ? ' active' : '') + '" onclick="goTo(' + songIdx + ',' + i + ')">' +
          (isActive ? '<div class="live-badge">Live</div>' : '') +
          '<div class="thumb-label">' + esc(slide.label) + '</div>' +
          '<div class="thumb-lines">' + preview + '</div></div>';
      }).join('');

      document.getElementById('position-song').textContent = song.title + ' — ';
      document.getElementById('position-slide').textContent = 'slide ' + (slideIdx + 1) + ' of ' + song.slides.length;

      setTimeout(function () {
        var a = grid.querySelector('.slide-thumb.active');
        if (a) a.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    }

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
      if (e.key === 'b' || e.key === 'B') toggleBlank();
    });
    document.getElementById('btn-next').addEventListener('click', next);
    document.getElementById('btn-prev').addEventListener('click', prev);
    document.getElementById('btn-blank').addEventListener('click', toggleBlank);

    function init(items) {
      songs = buildSongs(items);
      try {
        var saved = JSON.parse(localStorage.getItem('lbc-worship-state') || 'null');
        if (saved && saved.songIndex != null) {
          songIdx = saved.songIndex || 0;
          slideIdx = saved.slideIndex || 0;
          isBlank = !!saved.blank;
          if (isBlank) {
            document.getElementById('btn-blank').classList.add('blanked');
            document.getElementById('btn-blank').textContent = 'Show';
          }
        }
      } catch (e) {}
      if (songIdx >= songs.length) songIdx = 0;
      if (slideIdx >= (songs[songIdx] ? songs[songIdx].slides.length : 1)) slideIdx = 0;
      render();
      if (songs.length) broadcast();
    }

    LBCSheet.loadSongs(init);
  </script>
</body>
</html>
