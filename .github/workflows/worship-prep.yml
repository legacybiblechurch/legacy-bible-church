name: Worship prep

# Reads the setlist Google Sheet, drafts lyrics for candidate videos (Pass A),
# and applies any rows marked Review = Approve (Pass B). Commits drafts/ always;
# commits js/songs-data.js + js/worship-songs.js only when a song is approved.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "draft | apply | both"
        default: "both"
        required: false
  schedule:
    # every 20 min Sat & Sun (UTC) - covers Saturday-night prep and Sunday-morning
    # tweaks. GitHub may delay scheduled runs by a few minutes. Idle runs make no commit.
    - cron: "*/20 * * * 5,6,0"

concurrency:
  group: worship-prep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests yt-dlp

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        working-directory: scripts/prep
        run: python run.py "${{ github.event.inputs.mode || 'both' }}"

      - name: Commit changes
        run: |
          git config user.name  "lbc-worship-bot"
          git config user.email "worship-bot@users.noreply.github.com"
          git add drafts js/songs-data.js js/worship-songs.js
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "worship-prep: refresh drafts / apply approvals [skip ci]"
          # another run or a manual push may have moved main since checkout
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 2))
          done
          git push
