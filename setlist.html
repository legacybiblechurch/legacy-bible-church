<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunday Setlist — Legacy Bible Church</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0b0b0b;
      color: #f0f0f0;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 800;
      color: #C9A84C;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      text-align: center;
    }

    .date {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 48px;
      text-align: center;
      letter-spacing: 0.06em;
    }

    .songs {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 480px;
    }

    .song-card {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .song-num {
      font-size: 22px;
      font-weight: 800;
      color: #C9A84C;
      width: 28px;
      flex-shrink: 0;
      text-align: center;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 16px;
      font-weight: 700;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-top: 3px;
    }

    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #ff0000;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.15s;
      letter-spacing: 0.02em;
    }
    .yt-btn:hover { opacity: 0.85; }

    .yt-icon {
      width: 14px;
      height: 10px;
      flex-shrink: 0;
    }

    .no-song {
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      text-align: center;
      font-style: italic;
    }

    .footer-note {
      margin-top: 48px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      text-align: center;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="logo">Legacy Bible Church</div>
  <h1>Sunday Setlist</h1>
  <div class="date" id="date-line">Loading…</div>

  <div class="songs" id="song-list">
    <p class="no-song">Loading songs…</p>
  </div>

  <div class="footer-note">Bookmark this page — it updates every week automatically.</div>

  <script src="js/songs-data.js"></script>
  <script src="js/worship-songs.js"></script>
  <script>
    // Show Sunday's date
    var now    = new Date();
    var day    = now.getDay();
    var diff   = (7 - day) % 7 || 7; // days until next Sunday (or today if Sunday)
    if (day === 0) diff = 0;
    var sunday = new Date(now);
    sunday.setDate(now.getDate() + diff);
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('date-line').textContent =
      months[sunday.getMonth()] + ' ' + sunday.getDate() + ', ' + sunday.getFullYear();

    // Build song list
    var list = document.getElementById('song-list');
    list.innerHTML = '';

    window.WORSHIP_SETLIST.forEach(function(slug, i) {
      var data = LEGACY_SONGS[slug];
      if (!data) {
        var err = document.createElement('div');
        err.className = 'song-card';
        err.innerHTML = '<span class="song-num">' + (i + 1) + '</span>' +
          '<div class="song-info"><div class="song-title" style="color:#f88">Song not found: ' + slug + '</div></div>';
        list.appendChild(err);
        return;
      }

      var card = document.createElement('div');
      card.className = 'song-card';
      card.innerHTML =
        '<div class="song-num">' + (i + 1) + '</div>' +
        '<div class="song-info">' +
          '<div class="song-title">' + data.title + '</div>' +
          '<div class="song-sub">Tap to open on YouTube</div>' +
        '</div>' +
        (data.youtube
          ? '<a class="yt-btn" href="' + data.youtube + '" target="_blank" rel="noopener">' +
              '<svg class="yt-icon" viewBox="0 0 14 10" fill="currentColor"><path d="M13.7 1.56A1.76 1.76 0 0 0 12.47.32C11.37 0 7 0 7 0S2.63 0 1.53.32A1.76 1.76 0 0 0 .3 1.56C0 2.67 0 5 0 5s0 2.33.3 3.44a1.76 1.76 0 0 0 1.23 1.24C2.63 10 7 10 7 10s4.37 0 5.47-.32a1.76 1.76 0 0 0 1.23-1.24C14 7.33 14 5 14 5s0-2.33-.3-3.44ZM5.6 7.14V2.86L9.24 5 5.6 7.14Z"/></svg>' +
              'Play' +
            '</a>'
          : '<span style="font-size:12px;color:rgba(255,255,255,0.25)">No link</span>') +
      '</div>';
      list.appendChild(card);
    });
  </script>
</body>
</html>
